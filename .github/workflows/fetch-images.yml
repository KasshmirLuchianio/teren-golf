name: Fetch AI-generated images

on:
  workflow_dispatch:
  push:
    branches:
      - claude/golf-course-website-mvp-tqx9ae
    paths:
      - ".github/workflows/fetch-images.yml"
      - "scripts/fetch_images.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Download and optimize images
        run: python scripts/fetch_images.py

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git commit -m "Add optimized AI-generated site images"
          git push
